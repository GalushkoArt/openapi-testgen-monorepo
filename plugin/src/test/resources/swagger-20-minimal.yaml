swagger: "2.0"
info:
  title: Swagger Minimal API
  version: "1.0"
host: api.example.test
basePath: /v1
schemes:
  - https
produces:
  - application/json
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: true
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      responses:
        "200":
          description: OK
          schema:
            type: object
            properties:
              ok:
                type: boolean
