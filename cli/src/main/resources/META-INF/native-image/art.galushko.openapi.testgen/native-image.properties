# GraalVM Native Image build arguments
# See: https://www.graalvm.org/latest/reference-manual/native-image/overview/BuildConfiguration/
#
# To regenerate reflection/resource configs after adding new dependencies:
#   ./gradlew :cli:regenerateNativeImageConfig
# This runs the tracing agent and merges results into this directory.

Args = \
  --no-fallback \
  --enable-http \
  --enable-https \
  --initialize-at-build-time=ch.qos.logback \
  --initialize-at-build-time=org.slf4j \
  -H:+ReportExceptionStackTraces
