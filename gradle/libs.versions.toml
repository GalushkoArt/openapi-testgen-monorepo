[versions]
# Project
openapi-testgen = "0.12.0"

# Kotlin
# 2.4.0 is out but the tooling ecosystem lags: dependency-analysis (kotlin-metadata-jvm) reads
# metadata up to 2.3 only. Bump once DAGP supports Kotlin 2.4 metadata.
kotlin = "2.4.10"

# Docs
dokka = "2.2.0"

# Testing
junit = "5.14.4"
assertj = "3.27.7"
allure-plugin = "4.1.0"
aspectjweaver = "1.9.25.1"
allure = "2.35.4"
allure-generator = "2.46.0"

# Logging
slf4j = "2.0.18"
logback = "1.6.3"

# Jackson
# IMPORTANT: stay on the Jackson 2.x line (com.fasterxml.jackson.*). Jackson 3 moved to the
# tools.jackson group and is not fully supported by the swagger-core/swagger-parser modules.
# Keep jackson-lib aligned with the version swagger-core builds against (see its parent POM).
jackson-lib = "2.22.2"
jackson-annotations = "2.22"

# OpenAPI / Swagger
swagger-models = "2.2.55"
# Pinned: 2.1.43+ ("resolve refs within external schemas", swagger-parser#2338) breaks local
# `$defs` refs inside OAS 3.1 schemas that declare `$id` — constraints silently vanish and the
# cli golden suites lose generated test cases (see swagger-parser#2331). Re-try on new releases
# with `./gradlew :cli:test`.
swagger-parser = "2.1.48"
# The v1 (Swagger 2.0) parser pulled in by swagger-parser-v2-converter; keep aligned with the
# version that converter ships transitively. Declared explicitly because core configures the v1
# parser's global SnakeYAML options directly.
swagger-parser-v1 = "1.0.76"

# Template engine
mustache = "0.9.14"

# CLI
picocli = "4.7.7"

# Regex generation
regexp-gen = "3.0.0"

# Apache commons
commons-lang3 = "3.20.0"

# Code quality
detekt = "1.23.8"
kover = "0.9.9"

# Gradle plugins
maven-publish = "0.37.0"
graalvm-native = "1.1.11"
shadow = "9.6.1"
binary-compatibility = "0.18.2"
dependency-versions = "0.61.0"
dependency-analysis = "3.19.1"
gradle-plugin-publish = "1.3.1"

[libraries]
# OpenAPI Test Generator (internal modules)
testgen-model = { module = "art.galushko.openapi.testgen:model", version.ref = "openapi-testgen" }
testgen-example-value = { module = "art.galushko.openapi.testgen:example-value", version.ref = "openapi-testgen" }
testgen-core = { module = "art.galushko.openapi.testgen:core", version.ref = "openapi-testgen" }
testgen-generator-template = { module = "art.galushko.openapi.testgen:generator-template", version.ref = "openapi-testgen" }
testgen-pattern-value = { module = "art.galushko.openapi.testgen:pattern-value", version.ref = "openapi-testgen" }
testgen-pattern-support = { module = "art.galushko.openapi.testgen:pattern-support", version.ref = "openapi-testgen" }
testgen-distribution-bundle = { module = "art.galushko.openapi.testgen:distribution-bundle", version.ref = "openapi-testgen" }

# Kotlin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-lib" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-lib" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson-lib" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson-lib" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson-lib" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

# OpenAPI / Swagger
swagger-models = { module = "io.swagger.core.v3:swagger-models", version.ref = "swagger-models" }
swagger-parser-core = { module = "io.swagger.parser.v3:swagger-parser-core", version.ref = "swagger-parser" }
swagger-parser-v1 = { module = "io.swagger:swagger-parser", version.ref = "swagger-parser-v1" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser-v3", version.ref = "swagger-parser" }
swagger-parser-v2-converter = { module = "io.swagger.parser.v3:swagger-parser-v2-converter", version.ref = "swagger-parser" }

# Template engine
mustache = { module = "com.github.spullara.mustache.java:compiler", version.ref = "mustache" }

# CLI
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# Regex generation
regexp-gen = { module = "org.cornutum.regexp:regexp-gen", version.ref = "regexp-gen" }

# Apache commons
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Allure
aspectjweaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectjweaver" }
allure-junit5 = { module = "io.qameta.allure:allure-junit5", version.ref = "allure" }
allure-java-commons = { module = "io.qameta.allure:allure-java-commons", version.ref = "allure" }
allure-assertj = { module = "io.qameta.allure:allure-assertj", version.ref = "allure" }
allure-attachments = { module = "io.qameta.allure:allure-attachments", version.ref = "allure" }
allure-generator = { module = "io.qameta.allure:allure-generator", version.ref = "allure-generator" }

# Code quality
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
allure = { id = "io.qameta.allure", version.ref = "allure-plugin" }
binary-compatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility" }
dependency-versions = { id = "com.github.ben-manes.versions", version.ref = "dependency-versions" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
