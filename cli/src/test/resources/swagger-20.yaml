swagger: "2.0"
info:
  title: Swagger Minimal API
  version: "1.0"
host: api.example.test
basePath: /v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-Api-Key
    in: header
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: true
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      responses:
        "200":
          description: OK
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  type: string
          examples:
            application/json:
              items:
                - cat
    post:
      operationId: createPet
      security:
        - ApiKeyAuth: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}/labels:
    post:
      operationId: addPetLabel
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - name: petId
          in: path
          required: true
          type: string
        - name: label
          in: formData
          required: true
          type: string
          minLength: 2
      responses:
        "204":
          description: No Content
definitions:
  NewPet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 2
        example: Bella
      tags:
        type: array
        items:
          type: string
  Pet:
    allOf:
      - $ref: "#/definitions/NewPet"
      - type: object
        required:
          - id
        properties:
          id:
            type: integer
            format: int64
            example: 7
