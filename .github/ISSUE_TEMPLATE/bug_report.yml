name: Bug report
description: Something is broken or produces wrong output
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Gradle plugin
        - CLI (JVM / fat JAR)
        - CLI (native binary / npm)
        - Generated test code (templates)
        - Core generation / rules
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.12.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include error output if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >-
        Ideally a minimal OpenAPI/Swagger spec snippet plus the CLI command or Gradle
        configuration that triggers the problem.
      render: yaml
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Java version:
        Gradle version (for the plugin):
