swagger: "2.0"
info:
  title: Swagger Request Body API
  version: "1.0"
consumes:
  - application/json
produces:
  - application/json
paths:
  /pets:
    post:
      operationId: createPet
      consumes:
        - application/vnd.pet+json
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: "#/definitions/PetCreate"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Pet"
          examples:
            application/json:
              id: pet-1
              name: Milo
definitions:
  PetCreate:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 2
      age:
        type: integer
        minimum: 0
  Pet:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
