storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/conf/htpasswd

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Local-only for testing: don't proxy to npm so we can publish any version
  "@openapi-testgen/*":
    access: $all
    publish: $all
  # All other scoped packages proxy to npm
  "@*/*":
    access: $all
    publish: $all
    proxy: npmjs
  "**":
    access: $all
    publish: $all
    proxy: npmjs

logs:
  - {type: stdout, format: pretty, level: http}

# Allow larger npm tarballs (native binaries ~30MB each).
max_body_size: 200mb
