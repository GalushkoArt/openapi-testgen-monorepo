openapi: 3.0.3
info:
    title: Mixed-Strategy Demonstration API
    version: 1.3.0
    contact:
        name: API Architecture Team
        email: api-arch@example.com

security: []

paths:
    /products/search:
        get:
            summary: Search Products (Polymorphic & Multi-Example)
            operationId: searchProducts
            parameters:
                - name: query
                  in: query
                  description: The search keyword.
                  required: true
                  schema:
                      type: string
                      minLength: 3
                      example: "macbook"
            responses:
                '200':
                    description: OK. Returns either a Physical or Digital product.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/PhysicalProduct'
                                    - $ref: '#/components/schemas/DigitalProduct'
                                discriminator:
                                    propertyName: productType
                                    mapping:
                                        physical: '#/components/schemas/PhysicalProduct'
                                        digital: '#/components/schemas/DigitalProduct'
                            examples:
                                PhysicalItem:
                                    summary: Example of a physical good
                                    value:
                                        id: "123-abc"
                                        productType: "physical"
                                        name: "Mechanical Keyboard"
                                        price: 150.00
                                        weightKg: 1.2
                                        shippingRestricted: false
                                DigitalItem:
                                    summary: Example of a digital download
                                    value:
                                        id: "999-xyz"
                                        productType: "digital"
                                        name: "E-Book: API Design"
                                        price: 20.00
                                        fileSizeMb: 5.5
                                        downloadUrl: "https://example.com/dl/123"
                '400':
                    description: Bad Request. Demonstrates multiple error scenarios.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            examples:
                                ShortStringError:
                                    summary: Scenario - Query too short
                                    value:
                                        status: 400
                                        code: "VALIDATION_ERR"
                                        message: "Query must be 3+ chars."
                                RestrictedWordError:
                                    summary: Scenario - Profanity filter
                                    value:
                                        status: 400
                                        code: "CONTENT_MODERATION"
                                        message: "Query contains restricted terms."

    /orders/status:
        get:
            summary: Check Order Status (Property-Level Examples)
            operationId: getOrderStatus
            parameters:
                - name: trackingId
                  in: query
                  description: The shipment tracking ID.
                  required: true
                  schema:
                      type: string
                      example: "TRK-998877"
            responses:
                '200':
                    description: Returns status with inline examples.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    trackingId:
                                        type: string
                                        example: "TRK-998877"
                                    status:
                                        type: string
                                        enum: [SHIPPED, PENDING]
                                        example: "SHIPPED"
                                    estimatedDelivery:
                                        type: string
                                        format: date
                                        example: "2023-12-25"

    /users/list:
        get:
            summary: List Users (Array-Level Example)
            operationId: listUsers
            parameters:
                - name: group
                  in: query
                  description: The user group to filter by.
                  required: true
                  schema:
                      type: string
                      example: "admins"
            responses:
                '200':
                    description: A list of users.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/User'
                            example:
                                - id: 101
                                  username: "alice_dev"
                                  role: "admin"
                                - id: 102
                                  username: "bob_qa"
                                  role: "editor"

    /system/info:
        get:
            summary: System Info (No Examples)
            description: Swagger UI will generate dummy values (0, "string") based on types.
            operationId: getSystemInfo
            parameters:
                - name: nodeId
                  in: query
                  description: The server node ID.
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: System metrics.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - uptimeSeconds
                                    - isHealthy
                                properties:
                                    uptimeSeconds:
                                        type: integer
                                        format: int64
                                        description: Seconds since boot.
                                    isHealthy:
                                        type: boolean
                                    environment:
                                        type: string

components:
    schemas:
        BaseProduct:
            type: object
            required: [id, productType, name, price]
            properties:
                id: { type: string }
                productType: { type: string }
                name: { type: string }
                price: { type: number }

        PhysicalProduct:
            allOf:
                - $ref: '#/components/schemas/BaseProduct'
                - type: object
                  properties:
                      weightKg: { type: number }
                      shippingRestricted: { type: boolean }

        DigitalProduct:
            allOf:
                - $ref: '#/components/schemas/BaseProduct'
                - type: object
                  properties:
                      fileSizeMb: { type: number }
                      downloadUrl: { type: string }
        User:
            type: object
            properties:
                id: { type: integer }
                username: { type: string }
                role: { type: string }

        ErrorResponse:
            type: object
            required: [status, code, message]
            properties:
                status: { type: integer }
                code: { type: string }
                message: { type: string }
