openapi: 3.1.0

info:
    title: Complex Schema API - Create User
    version: 1.0.0
    description: POST /users operation - Create a new user

servers:
    -   url: https://api.example.com/v1
        description: Production server

tags:
    -   name: users
        description: User management operations

paths:
    /users:
        post:
            tags: [users]
            summary: Create a new user
            operationId: createUser
            description: Create a new user with merged object properties
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            allOf:
                                -   $ref: '#/components/schemas/MergedObject'
                                -   type: object
                                    required: [contactInfo]
                                    properties:
                                        contactInfo:
                                            $ref: '#/components/schemas/ContactInfo'
                                        role:
                                            type: string
                                            enum: [admin, user, guest]
                                            default: user
                                        metadata:
                                            $ref: '#/components/schemas/FlexibleValue'
                                        tags:
                                            allOf:
                                                - $ref: '#/components/schemas/LabelList'
                                                - description: Optional labels to categorize the user

            responses:
                '201':
                    description: User created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    -   $ref: '#/components/schemas/ApiResponse'
                                    -   type: object
                                        properties:
                                            data:
                                                $ref: '#/components/schemas/User'

                '400':
                    $ref: '#/components/responses/BadRequest'
                '409':
                    description: User already exists
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'

components:
    schemas:
        MergedObject:
            allOf:
                -   type: object
                    required: [ firstName ]
                    properties:
                        firstName:
                            type: string
                        lastName:
                            type: string

                -   type: object
                    required: [ age ]
                    properties:
                        age:
                            type: integer
                            minimum: 0
                        email:
                            type: string
                            format: email

        ContactInfo:
            anyOf:
                -   type: object
                    required: [ email ]
                    properties:
                        email:
                            type: string
                            format: email

                -   type: object
                    required: [ phone ]
                    properties:
                        phone:
                            type: string
                            pattern: '^\+?[1-9]\d{1,14}$'

                -   type: object
                    required: [ address ]
                    properties:
                        address:
                            type: object
                            required: [ street, city, country ]
                            properties:
                                street:
                                    type: string
                                city:
                                    type: string
                                country:
                                    type: string
                                postalCode:
                                    type: string

        FlexibleValue:
            anyOf:
                -   type: string
                    minLength: 1
                -   type: number
                -   type: boolean

        Label:
            type: object
            required: [key]
            properties:
                key:
                    type: string
                    minLength: 1
                    maxLength: 128
                value:
                    type: string
                    maxLength: 256

        LabelList:
            type: array
            items:
                $ref: '#/components/schemas/Label'
            minItems: 0
            maxItems: 10

        BaseEntity:
            type: object
            required: [ id, createdAt ]
            properties:
                id:
                    type: string
                    format: uuid
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        User:
            allOf:
                -   $ref: '#/components/schemas/BaseEntity'
                -   type: object
                    required: [ username, email ]
                    properties:
                        username:
                            type: string
                            minLength: 3
                            maxLength: 20
                        email:
                            type: string
                            format: email
                        role:
                            type: string
                            enum: [ admin, user, guest ]
                            default: user

        ApiResponse:
            type: object
            allOf:
                -   type: object
                    required: [ status, timestamp, requestId ]
                    properties:
                        status:
                            type: string
                            enum: [ success, error, pending ]
                        timestamp:
                            type: string
                            format: date-time
                        requestId:
                            type: string
                            format: uuid

            oneOf:
                -   type: object
                    required: [ data ]
                    properties:
                        data:
                            type: object
                            description: Success response payload

                -   type: object
                    required: [ error ]
                    properties:
                        error:
                            type: object
                            required: [ code, message ]
                            properties:
                                code:
                                    type: string
                                message:
                                    type: string
                                details:
                                    type: array
                                    items:
                                        type: string

                -   type: object
                    required: [ pendingInfo ]
                    properties:
                        pendingInfo:
                            type: object
                            required: [ statusUrl ]
                            properties:
                                statusUrl:
                                    type: string
                                    format: uri
                                estimatedCompletion:
                                    type: string
                                    format: date-time

    responses:
        BadRequest:
            description: Bad request - validation error
            content:
                application/json:
                    schema:
                        allOf:
                            -   $ref: '#/components/schemas/ApiResponse'
                            -   type: object
                                properties:
                                    error:
                                        type: object
                                        properties:
                                            code:
                                                type: string
                                                enum: [VALIDATION_ERROR, INVALID_INPUT]
                                            message:
                                                type: string
                                            details:
                                                type: array
                                                items:
                                                    type: string

    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT-based authentication

        ApiKeyAuth:
            type: apiKey
            in: header
            name: X-API-Key
            description: API key authentication

security:
    -   BearerAuth: []
    -   ApiKeyAuth: []
