org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx3g


# Dokka: use V2 tasks (HTML output, integrated into MkDocs as static pages).
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
dokkaSourceBaseUrl=https://github.com/GalushkoArt/openapi-testgen-monorepo
